name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore InventoryApi.sln
      - name: Build
        run: dotnet build InventoryApi.sln --no-restore -c Release
      # Excludes the Testcontainers-based DB tests (see integration-test below)
      # so every push/PR gets fast, deterministic feedback with no Docker
      # dependency in this job.
      - name: Test
        run: dotnet test InventoryApi.sln --no-build -c Release --filter "Category!=Integration"

  # Real integration tests: spins up a throwaway SQL Server via Testcontainers
  # and exercises the actual stock-concurrency fix against it (see
  # tests/Inventory.Api.Tests/Integration). Only on push to main/master, not
  # on every PR, since it's slower (container pull + startup) than the unit
  # tests above. ubuntu-latest runners have Docker available already.
  integration-test:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run integration tests
        run: dotnet test InventoryApi.sln --filter "Category=Integration"

  # Only builds and publishes the image once build-and-test passes on main/master.
  # There is no deploy job here on purpose: this repo has no real deploy target
  # yet (see ci_cd/kubernetes for manifests you can apply manually with kubectl).
  # A placeholder "echo Deploy to production" step was removed rather than kept,
  # since a CI step that does nothing is worse than no step at all.
  docker-build-and-push:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Inventory.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-api:latest
            ghcr.io/${{ github.repository_owner }}/inventory-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
